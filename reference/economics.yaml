# Platform economics (v2, DRAFT 2026-11-09). Every number cites a public source.
# Seeded from the Tools Companies vault analysis spatial-platform-comparison, where each value was checked.
#
# source_type, in the model's order of preference:
#   paid  = federal purchase record (USAspending.gov award amount)
#   gsa   = federal schedule price (Government Scientific Source product page)
#   list  = vendor price list or web store
#   filing = price stated in a 10-K, earnings call or investor day
#   s10   = NIH S10 shared-instrument award (regular S10 capped at $750K; may bundle accessories)
#   press = launch or trade-press price
# Not ranked: spec (vendor claim), derived (computed from cited inputs), model (an assumption of the cost model),
#   core (academic core-facility rate: what a researcher pays; shown as a check, never a model input).
# The model takes the most recent value of the best-ranked source type; ties take the lower value.
# model: false keeps a value on the page but out of the model (upgrades, bundles, unclear scope).
# as_of: YYYY-MM (award or access month) or YYYY (fiscal year).
#
# platforms.<name> uses the taxonomy name. Per platform:
#   instrument: hardware a lab has to buy; `item` names it when it isn't the platform itself
#   service:    service contract per year
#   configs:    costed assay configurations: unit, consumables and sequencing per unit, capacity at 100% use
#   core:       per-unit core rates for a config
#   award_terms: USAspending keywords; ingest.usaspending pulls matching federal awards as evidence to review

model:
  amortize_years: 5
  default_service_share: 0.12   # of instrument price per year, used only when no service price is public
  utilization: {low: 0.25, typical: 0.5, max: 1.0}   # typical lab, busy core, vendor-spec maximum
  excludes: labor, sample prep, analysis, facility overhead

sequencing:   # applied to configs with read_pairs_m
  usd_per_gb: 2.0
  gb_per_m_pairs: 0.3   # 2x150
  source_type: spec
  as_of: 2026-11
  url: https://assets.illumina.com/systems/sequencing-platforms/novaseq-x-plus/specifications.html
  note: NovaSeq X 25B reagent cost at full flow-cell use, a floor; core sequencing rates are higher

platforms:

  Visium HD:
    award_terms: ["Visium HD", "CytAssist"]   # USAspending search (ingest.usaspending)
    instrument:
      - {usd: 54457, item: Visium CytAssist, source_type: gsa, as_of: 2026-11, url: "https://www.govsci.com/product-detail/10x--Genomics/1000441"}
      - {usd: 75395, item: Visium CytAssist, source_type: paid, as_of: 2022-09, url: "https://www.usaspending.gov/award/CONT_AWD_75N91022P00956_7529_-NONE-_-NONE-"}
      - {usd: 86160, item: Visium CytAssist, source_type: paid, as_of: 2024-12, url: "https://www.usaspending.gov/award/CONT_AWD_HU000125P0010_9700_-NONE-_-NONE-"}
    service:
      - {usd: 11819, item: CytAssist 12-month assurance plan, source_type: gsa, as_of: 2026-11, url: "https://www.govsci.com/product-detail/10x--Genomics/1000524"}
    needs: a sequencer (not costed; sequencing is priced per read instead)
    configs:
      - name: FFPE, 6.5 mm
        unit: capture area
        area_mm2: 42
        plex: whole transcriptome, ~18K genes (probe-based)
        consumables: {usd: 3449, source_type: gsa, as_of: 2026-11, url: "https://www.govsci.com/product-detail/10x--Genomics/1000675", note: "4-reaction kit $13,795 / 4"}
        read_pairs_m: {value: 275, source_type: spec, url: "https://www.10xgenomics.com/support/spatial-gene-expression-hd/documentation/steps/sequencing/sequencing-requirements-for-visium-hd-spatial-gene-expression"}
        capacity: {per_year: 500, source_type: model, basis: about 10 capture areas a week; the CytAssist is not the bottleneck}
        core:
          - {usd: 4500, rate: internal, facility: Pitt HSSC, source_type: core, as_of: 2026-11, url: "https://www.sharedfacilities.pitt.edu/health-sciences-sequencing-core/pricing", note: "$9,000 per 2-area slide"}
          - {usd: 4619, rate: internal, facility: Weill Cornell EPICORE, source_type: core, as_of: 2026-11, url: "https://epicore.med.cornell.edu/pricelist.php", note: "$9,237 per 2-area slide"}
          - {usd: 3193, rate: external academic, facility: UCLA TCGB, source_type: core, as_of: 2026-07, url: "https://www.uclahealth.org/departments/pathology/research-services/technology-center-genomics-bioinformatics-tcgb/pricing", note: "$6,387 per 2-area slide"}
      - name: Fresh frozen, 6.5 mm
        unit: capture area
        area_mm2: 42
        plex: whole transcriptome, ~18K genes (probe-based)
        consumables: {usd: 3449, source_type: gsa, as_of: 2026-11, url: "https://www.govsci.com/product-detail/10x--Genomics/1000675", note: "4-reaction kit $13,795 / 4"}
        read_pairs_m: {value: 700, source_type: spec, url: "https://www.10xgenomics.com/support/spatial-gene-expression-hd/documentation/steps/sequencing/sequencing-requirements-for-visium-hd-spatial-gene-expression"}
        capacity: {per_year: 500, source_type: model, basis: about 10 capture areas a week; the CytAssist is not the bottleneck}

