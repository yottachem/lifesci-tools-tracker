[project]
name = "lifesci-tools-tracker"
version = "0.1.0"
description = "Life science tools technologies on a maturity map from publications, NIH grants, patents, and companies"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6",
    "pandas>=2.2",
    "pyarrow>=17",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
