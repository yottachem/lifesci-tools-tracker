# Source registry. Checked 2026-11-03.
sources:
  openalex:
    name: OpenAlex works
    url: https://api.openalex.org/works
    auth: free API key ($1/day); Keychain item openalex-api-key or OPENALEX_API_KEY
    cost: group_by count query $0.001
    license: CC0
    module: ingest.openalex
  reporter:
    name: NIH RePORTER projects
    url: https://api.reporter.nih.gov/v2/projects/search
    auth: none; <= 1 request/second
    license: Public domain (US Gov)
    module: ingest.reporter
  edgar:
    name: SEC EDGAR XBRL company facts
    url: https://data.sec.gov/api/xbrl/companyfacts/
    auth: none; User-Agent with contact email; <= 10 requests/second
    license: Public domain (US Gov)
    module: ingest.edgar
  uspto_odp:
    name: USPTO Open Data Portal (PatentsView, migrated 2026-03-20)
    url: https://api.uspto.gov
    auth: X-API-KEY; USPTO.gov account + ID.me
    license: Public domain (US Gov)
    module: ingest.uspto  # bulk products PVGPATDIS + PVPGPUBDIS; the patent search API returns 403 for this key
    cadence: files refresh quarterly-ish; 2026-11-03 copy runs through 2025-12-31
  prices:
    name: Month-end close (unofficial)
    url: https://query1.finance.yahoo.com/v8/finance/chart/
    auth: none
    license: Unofficial; publish derived monthly market cap only, never raw prices
    module: ingest.prices
